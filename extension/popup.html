<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Shardy</title>
<style>
  /* Tokens follow MangaLib's own theme variables (light by default, dark like the site's dark mode). */
  :root {
    color-scheme: light dark;
    --page: #f2f2f3;
    --panel: #ffffff;
    --ink: #212529;
    --ink-soft: #5c5f66;
    --ink-muted: #8a8a8e;
    --edge: rgba(60, 60, 67, .16);
    --edge-strong: rgba(60, 60, 67, .29);
    --fill: rgba(120, 120, 128, .12);
    --fill-hover: rgba(120, 120, 128, .2);
    --field: #ffffff;
    --field-edge: #dcdee2;
    --orange: #ff9100;
    --orange-press: #f57c00;
    --orange-soft: rgba(255, 145, 0, .14);
    --done: #3cce7b;
    --alert: #f44336;
    --rank-e: #7a6440; --rank-d: #c8801e; --rank-c: #9aa0a6; --rank-b: #3fb0c4; --rank-a: #c0344d; /* MangaLib rank colors */
    --bar: #c46a00; /* light-theme bar orange, 3:1 against the panel */
    --r-control: 6px;
    --r-panel: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0a0a0a;
      --panel: #1c1c1e;
      --ink: #ffffff;
      --ink-soft: #bfbfbf;
      --ink-muted: rgba(235, 235, 245, .5);
      --edge: rgba(84, 84, 88, .4);
      --edge-strong: rgba(84, 84, 88, .65);
      --fill: rgba(118, 118, 128, .24);
      --fill-hover: rgba(120, 120, 128, .36);
      --field: #1a1a1a;
      --field-edge: #3b3d45;
      --orange-soft: rgba(255, 145, 0, .16);
      --done: #4baf50;
      --alert: #de7072;
      --bar: #ff9100;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  /* Chrome caps popups at 600px: the tab content takes whatever height is left and scrolls inside. */
  body {
    margin: 0; width: 380px; max-height: 600px; display: flex; flex-direction: column; overflow: hidden;
    background: var(--page); color: var(--ink-soft);
    font: 14px/1.43 -apple-system, system-ui, "Open Sans", Roboto, "Helvetica Neue", Helvetica, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 14px; height: 14px; flex: none; fill: currentColor; }
  .shard { color: var(--orange); }

  /* top bar, like the site header */
  .bar { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  .brand { display: flex; align-items: center; gap: 6px; flex: 1; color: var(--ink); font-weight: 600; letter-spacing: -.01em; }
  .brand svg { width: 18px; height: 18px; fill: currentColor; }
  .brand b { color: var(--orange); font-weight: 700; }
  .who { display: flex; align-items: center; gap: 6px; max-width: 190px; font-size: 13px; color: var(--ink-soft); }
  .who .ava { width: 24px; height: 24px; border-radius: 50%; background: var(--orange-soft); color: var(--orange); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
  .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who.off { color: var(--alert); }
  .who a { color: var(--orange); text-decoration: none; font-weight: 500; white-space: nowrap; }

  /* hero: the title being farmed */
  .hero { margin: 12px; padding: 12px; background: var(--panel); border-radius: var(--r-panel); }
  .now { display: flex; gap: 12px; }
  .cover { width: 52px; height: 74px; border-radius: var(--r-control); object-fit: cover; background: var(--fill); flex: none; display: block; }
  .now-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .eyebrow { font-size: 12px; color: var(--ink-muted); }
  .eyebrow.live { color: var(--orange); }
  .eyebrow.live::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; vertical-align: 1px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .now-name { color: var(--ink); font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .shards { display: flex; align-items: center; gap: 4px; font-size: 13px; margin-top: auto; }
  .shards strong { color: var(--ink); font-weight: 600; }
  .track { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 10px; }
  .track i { display: block; height: 100%; background: var(--orange); border-radius: 2px; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--edge); text-align: center; }
  .facts div + div { border-left: 1px solid var(--edge); }
  .facts dt { font-size: 12px; color: var(--ink-muted); }
  .facts dd { margin: 2px 0 0; color: var(--ink); font-size: 15px; font-weight: 600; }

  .cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; margin-top: 12px; border: 0; border-radius: var(--r-control); background: var(--orange); color: #fff; font-weight: 600; transition: transform .12s cubic-bezier(.23,1,.32,1), background-color .15s; }
  .cta svg { width: 14px; height: 14px; fill: currentColor; }
  .cta:hover { background: var(--orange-press); }
  .cta:active { transform: scale(.97); }
  .cta small { font-weight: 400; opacity: .8; font-size: 12px; }
  .cta.stop { background: var(--fill); color: var(--ink); }
  .cta.stop:hover { background: var(--fill-hover); }
  .cta:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .note { margin-top: 8px; font-size: 12px; color: var(--ink-muted); text-align: center; text-wrap: pretty; }
  .note.status { color: var(--ink-soft); }
  .note.warn { color: var(--orange); margin-top: 10px; }
  /* Add and Settings tabs: the hero shrinks to one row so the list gets the room. */
  body.compact .hero { margin: 8px 12px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
  body.compact .hero .facts, body.compact .hero .track, body.compact .hero .note, body.compact .hero .lead { display: none; }
  body.compact .hero .now { gap: 8px; align-items: center; min-width: 0; }
  body.compact .hero .cover { width: 26px; height: 37px; border-radius: 4px; }
  body.compact .hero .now-name { font-size: 14px; -webkit-line-clamp: 1; }
  body.compact .hero .shards, body.compact .hero .now-meta .eyebrow:not(.live) { display: none; }
  body.compact .hero .cta { margin: 0; height: 32px; width: auto; padding: 0 12px; font-size: 13px; }
  body.compact .hero .cta small { display: none; }
  .sk { display: block; border-radius: 4px; background: linear-gradient(90deg, var(--fill) 25%, var(--fill-hover) 50%, var(--fill) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .sk-line { height: 12px; margin: 6px 0; }
  .sk-pill { width: 96px; height: 24px; border-radius: 12px; }
  .sk-chip { width: 72px; height: 28px; border-radius: var(--r-control); }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lead { margin: 0; color: var(--ink-soft); font-size: 13px; text-wrap: pretty; }

  /* tabs, like the title page tabs */
  .tabs { display: flex; gap: 18px; padding: 0 12px; border-bottom: 1px solid var(--edge); }
  .tabs button { position: relative; height: 38px; padding: 0; border: 0; background: none; color: var(--ink-soft); }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--orange); }
  .tabs sup { font-size: 11px; color: var(--ink-muted); margin-left: 3px; vertical-align: 4px; }
  .bar, .hero, .tabs { flex: none; }
  .tabpanel { padding: 4px 12px 12px; overflow-y: auto; flex: 1 1 auto; min-height: 120px; }
  .tabpanel[hidden] { display: none; }
  .tabpanel::-webkit-scrollbar { width: 6px; }
  .tabpanel::-webkit-scrollbar-thumb { background: var(--fill-hover); border-radius: 3px; }

  /* title rows */
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--edge); }
  .row:last-child { border-bottom: 0; }
  .row .cover { width: 34px; height: 48px; border-radius: 4px; }
  .row-meta { flex: 1; min-width: 0; }
  .row-name { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-muted); }
  .row .track { margin-top: 5px; height: 3px; }
  .row.current .row-name { color: var(--orange); }
  .row.done .row-name { color: var(--ink-muted); }
  .row.done .track i { background: var(--done); }
  .tick { color: var(--done); }
  .tools { display: flex; gap: 2px; opacity: .5; transition: opacity .15s; }
  .row:hover .tools, .row:focus-within .tools { opacity: 1; }
  .ghost { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: var(--r-control); background: none; color: var(--ink-soft); }
  .ghost:hover { background: var(--fill); color: var(--ink); }
  .ghost:disabled { opacity: .3; cursor: default; background: none; }
  .ghost.remove:hover { color: var(--alert); }
  .soft { height: 28px; padding: 0 10px; border: 0; border-radius: var(--r-control); background: var(--fill); color: var(--ink); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 13px; }
  .soft:hover { background: var(--fill-hover); }
  .soft:disabled { opacity: .5; cursor: default; }
  .soft.wide { width: 100%; height: 34px; justify-content: center; margin-top: 8px; }
  .soft.accent { background: var(--orange); color: #fff; }
  .soft.accent:hover { background: var(--orange-press); }
  .muted { color: var(--ink-muted); font-size: 13px; padding: 14px 0; text-align: center; }

  /* add */
  h3 { margin: 14px 0 8px; font-size: 12px; font-weight: 500; color: var(--ink-muted); }
  .field { position: relative; }
  .field svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); }
  input[type=search], input[type=number] { width: 100%; height: 34px; padding: 0 10px 0 32px; border: 1px solid var(--field-edge); border-radius: var(--r-control); background: var(--field); outline: none; }
  input[type=search]:focus, input[type=number]:focus { border-color: var(--orange); }
  input[type=number] { width: 56px; padding: 0 4px; text-align: center; height: 30px; color: var(--ink); }
  /* preset values are shown dimmed; editing any of them switches to "custom" and they turn white */
  .grid.preset input[type=number] { color: var(--ink-muted); }
  select.unit { height: 30px; width: 52px; padding: 0 4px; border: 1px solid var(--field-edge); border-radius: var(--r-control); background: var(--field); color: var(--ink); font: inherit; font-size: 12px; outline: none; }
  select.unit:focus { border-color: var(--orange); }
  .unit-gap { width: 52px; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 28px; padding: 0 10px; border: 1px solid var(--edge-strong); border-radius: var(--r-control); background: none; color: var(--ink-soft); font-size: 13px; }
  .chip:hover { background: var(--fill); }
  .chip[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); color: var(--ink); }
  .chip sup { color: var(--ink-muted); margin-left: 3px; font-size: 11px; }
  .chips.seg { display: grid; grid-template-columns: repeat(4, 1fr); }
  .chips.seg .chip { padding: 0 4px; }
  .chips.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
  .chips.seg3 .chip { padding: 0 4px; font-size: 12px; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .actions .soft { flex: 1; height: 34px; justify-content: center; }
  .actions .soft[hidden] { display: none; }
  .badge { font-size: 11px; color: var(--ink-muted); background: var(--fill); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  .dim { color: var(--ink-muted); font-weight: 400; }
  .list-tools { display: flex; justify-content: flex-end; padding: 6px 0 2px; }
  details.ready summary { cursor: pointer; font-size: 12px; color: var(--ink-muted); padding: 10px 0 4px; list-style: none; }
  details.ready summary::before { content: "›"; display: inline-block; margin-right: 6px; transition: transform .15s; }
  details.ready[open] summary::before { transform: rotate(90deg); }
  details.ready .row { opacity: .75; }
  .pick { width: 18px; height: 18px; accent-color: var(--orange); flex: none; margin: 0 5px; }

  /* settings */
  .rank { width: 36px; height: 30px; padding: 0; border: 0; border-radius: var(--r-control); color: #fff; font-weight: 600; font-size: 13px; opacity: .28; transition: opacity .15s, transform .12s cubic-bezier(.23,1,.32,1); }
  .rank[aria-pressed="true"] { opacity: 1; }
  .rank:active { transform: scale(.95); }
  .rank.E { background: var(--rank-e); } .rank.D { background: var(--rank-d); } .rank.C { background: var(--rank-c); } .rank.B { background: var(--rank-b); } .rank.A { background: var(--rank-a); }
  .warn-text:empty { display: none; }
  .warn-text { color: var(--ink); }
  .hint { font-size: 12px; color: var(--ink-muted); margin-top: 6px; text-wrap: pretty; }
  .grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; margin-top: 12px; font-size: 13px; }
  .pair { display: flex; align-items: center; gap: 4px; color: var(--ink-muted); }

  /* opened as a tab (importing): center the popup-sized panel */
  html.page { background: var(--page); }
  html.page body { margin: 32px auto; max-height: none; border: 1px solid var(--edge); border-radius: var(--r-panel); }
  html.page .tabpanel { max-height: none; }

  /* update notice */
  .update { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 12px 0; padding: 8px 12px; border-radius: var(--r-control); background: var(--orange-soft); color: var(--ink); font-size: 13px; text-decoration: none; flex: none; }
  .update b { color: var(--orange); font-weight: 600; white-space: nowrap; }
  .update:hover { background: var(--fill-hover); }
  .update[hidden] { display: none; }

  /* history */
  .hfacts { margin: 6px 0 4px; padding-top: 0; border-top: 0; }
  .chart { position: relative; margin-top: 8px; padding-top: 30px; } /* headroom: tooltip and the peak label */
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 92px; border-bottom: 1px solid var(--edge); }
  .bars .col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; cursor: default; }
  .bars .col:hover, .bars .col:focus-visible { background: var(--fill); border-radius: 4px 4px 0 0; outline: none; }
  .bars i { display: block; width: 62%; min-height: 0; background: var(--bar); border-radius: 4px 4px 0 0; }
  .bars .peak { position: absolute; bottom: calc(var(--h) + 3px); font-size: 11px; color: var(--ink-soft); font-style: normal; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
  .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--panel); color: var(--ink); border: 1px solid var(--edge-strong); border-radius: var(--r-control); padding: 4px 8px; font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 2; }
  .tip[hidden] { display: none; }
  .rankdot { display: inline-grid; place-items: center; min-width: 22px; height: 18px; padding: 0 4px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 600; background: var(--fill-hover); }
  .rankdot.E { background: var(--rank-e); } .rankdot.D { background: var(--rank-d); } .rankdot.C { background: var(--rank-c); } .rankdot.B { background: var(--rank-b); } .rankdot.A { background: var(--rank-a); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-shard" viewBox="0 0 16 16"><path d="M14.6 1 15.6 2.2 13.4 10.2 11.6 11.2 10.9 12.6 9 13 8 14.2 6.6 14 5.4 14.5.3 15.9 2.2 8.2 4 6.9 4 6 4.6 4.3 5.2 3 6.1 2.5Z"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 3.5 13 8.6l-1.1 1.1L8.8 6.6V13H7.2V6.6L4.1 9.7 3 8.6Z"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 12.5 3 7.4l1.1-1.1 3.1 3.1V3h1.6v6.4l3.1-3.1L13 7.4Z"/></symbol>

    <symbol id="i-search" viewBox="0 0 16 16"><path d="M7 2a5 5 0 0 1 4 8l3.5 3.5-1.1 1.1L9.9 11.1A5 5 0 1 1 7 2Zm0 1.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z"/></symbol>

  <div class="bar">
    <div class="brand"><svg class="shard" aria-hidden="true"><use href="#i-shard"/></svg><span>Shard<b>y</b></span></div>
    <div class="who" id="account"><span class="sk sk-pill"></span></div>
  </div>

  <a class="update" id="update" href="#" target="_blank" rel="noopener" hidden></a>

  <div class="hero" id="hero">
    <div class="now"><span class="cover sk"></span><div class="now-meta"><span class="sk sk-line" style="width:40%"></span><span class="sk sk-line" style="width:75%"></span><span class="sk sk-line" style="width:55%"></span></div></div>
    <span class="sk sk-line" style="margin-top:14px"></span>
    <span class="sk" style="height:40px;margin-top:12px;border-radius:6px"></span>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-queue" aria-controls="queue" aria-selected="true"><span data-i18n="tabQueue"></span><sup id="queueCount" class="num"></sup></button>
    <button role="tab" id="tab-add" aria-controls="add" aria-selected="false" data-i18n="tabAdd"></button>
    <button role="tab" id="tab-history" aria-controls="history" aria-selected="false" data-i18n="tabHistory"></button>
    <button role="tab" id="tab-settings" aria-controls="settings" aria-selected="false" data-i18n="tabSettings"></button>

  <section class="tabpanel" id="queue" role="tabpanel" aria-labelledby="tab-queue">

  </section>

  <section class="tabpanel" id="add" role="tabpanel" aria-labelledby="tab-add" hidden>
    <button id="addCurrent" class="soft wide"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addCurrent"></span></button>
    <h3><label for="search" data-i18n="searchTitle"></label></h3>
    <div class="field"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off"></div>
    <ul id="searchResults"></ul>
    <h3 data-i18n="bookmarks"></h3>
    <div class="chips" id="folders" role="group"></div>

      <button id="addSelected" class="soft" hidden></button>

    <div class="hint" id="msg" role="status" aria-live="polite"></div>
  </section>

    <dl class="facts hfacts" id="hFacts"></dl>
    <div class="chart" id="hChart"></div>
    <h3 data-i18n="hCardsTitle"></h3>
    <ul id="hCards"></ul>
  </section>

  <section class="tabpanel" id="settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <h3 data-i18n="speed"></h3>
    <div class="chips seg" id="speeds" role="group"></div>
    <div class="hint" id="speedHint"></div>
    <div class="grid" id="paceGrid">
      <span data-i18n="pausePerPage"></span><span class="pair"><input id="pageMin" type="number" min="0" step="any" aria-label="min">–<input id="pageMax" type="number" min="0" step="any" aria-label="max"><select id="pageUnit" class="unit" aria-label="unit"></select></span>
      <span data-i18n="breakEvery"></span><span class="pair"><input id="breakEveryMin" type="number" min="1" aria-label="min">–<input id="breakEveryMax" type="number" min="1" aria-label="max"><span class="unit-gap"></span></span>
      <span data-i18n="breakLength"></span><span class="pair"><input id="breakMin" type="number" min="0" step="any" aria-label="min">–<input id="breakMax" type="number" min="0" step="any" aria-label="max"><select id="breakUnit" class="unit" aria-label="unit"></select></span>
      <label for="dailyMax" data-i18n="dailyMax"></label><span class="pair"><input id="dailyMax" type="number" min="0"><span class="unit-gap"></span></span>
    </div>
    <div class="hint" data-i18n="customHint"></div>
    <h3 data-i18n="ranks"></h3>
    <div class="chips" id="ranks" role="group"></div>
    <div class="hint" data-i18n="ranksHint"></div>
    <div class="hint" id="ranksSL"></div>
    <h3 data-i18n="autoBuy"></h3>
    <div class="chips" id="autobuy" role="group"></div>
    <div class="hint" data-i18n="autoBuyHint"></div>
    <h3 data-i18n="language"></h3>
    <div class="chips" id="langs" role="group"></div>
    <h3 data-i18n="notifications"></h3>
    <div class="chips" id="notify" role="group"></div>
    <div class="hint" data-i18n="notifyHint"></div>
    <h3 data-i18n="backup"></h3>
    <div class="actions">
      <button id="exportQueue" class="soft" data-i18n="exportQueue"></button>
      <button id="importQueue" class="soft" data-i18n="importQueue"></button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <div class="hint" data-i18n="importHint"></div>
    <div class="hint warn-text" id="importMsg" role="status" aria-live="polite"></div>
    <div class="hint num" id="versionLine"></div>
  </section>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
