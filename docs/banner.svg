<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <radialGradient id="glow" cx="88%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ff9100" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff9100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#fade)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- scattered shards -->
  <g opacity=".35">
    <polygon points="1027,40 1039,52 1021,90 1008,97 987,98 992,78 1006,58" fill="#ff9100"/>
    <polygon points="1196,232 1204,240 1192,265 1183,270 1169,271 1172,257 1182,244" fill="#ffab40"/>
    <polygon points="1012,286 1020,294 1008,319 999,324 985,325 988,311 998,298" fill="#f57c00"/>
  </g>

  <!-- main shard -->
  <g transform="translate(1020 76) scale(1.55)">
    <polygon points="90,16 110,36 80,100 58,112 22,114 30,80 54,46" fill="#ff9100"/>
    <polygon points="90,16 110,36 70,72 54,46" fill="#ffab40"/>
    <polygon points="70,72 80,100 58,112 22,114" fill="#f57c00"/>
  </g>

  <text x="80" y="170" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">Shard<tspan fill="#ff9100">y</tspan></text>
  <text x="84" y="226" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="30" fill="#bfbfbf">Your MangaLib card-shard collector.</text>
  <text x="84" y="266" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" fill="#8a8a8e">Reads only chapters that pay · stays inside the site limits · stops when every card is covered</text>
</svg>
